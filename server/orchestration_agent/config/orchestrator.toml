[server]
addr      = "0.0.0.0:50051"   # enrollment port — server-TLS only, no client cert
mtls_addr = "0.0.0.0:50052"   # operational port — full mTLS, client cert mandatory
enable_tls = true
require_client_cert = false    # this field now applies to port 50051 only

[tls]
ca_cert = "certs/ca.pem"
ca_key = "certs/ca.key"
server_cert = "certs/server.pem"
server_key = "certs/server.key"