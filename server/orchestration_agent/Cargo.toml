[package]
name = "orchestrator"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "io-util", "signal", "fs", "process"] }
tokio-stream = "0.1"
tonic = { version = "0.11", features = ["tls"] }
tonic-reflection = "0.10"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
sha2 = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["pem"] }
pkcs8 = "0.10"
bytes = "1.6"
uuid = { version = "1.8", features = ["v4"] }
rcgen = "0.13"
anyhow = "1.0"
lazy_static = "1.4"
tempfile = "3"
once_cell = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.21"
futures = "0.3"
dirs = "5.0"
serde_json = "1"
# FIX: Removed `nix = { ..., optional = true }`.
# The original code used nix in an unconditional #[cfg(unix)] block without a
# feature gate. Because nix was `optional = true`, it was never compiled in,
# causing a link error on every Unix build. The ledger now uses an in-process
# Mutex + O_APPEND instead of flock(), so nix is no longer needed at all.
#
# FIX: `windows_sys` was used in a #[cfg(windows)] block in ledger.rs but was
# never declared here. Removed the windows_sys locking code; the Mutex approach
# works correctly on Windows too.

[build-dependencies]
tonic-build = "0.11"